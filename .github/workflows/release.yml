name: Release Crimpdeq 3D Case

on:
    release:
        types: [created]

permissions:
    contents: write

jobs:
    case:
        name: Build 3D case release files
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Prepare output folder
              run: mkdir -p artifacts

            - name: Install OpenSCAD and Bambu Studio dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y openscad libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libwebkit2gtk-4.1-0

            - name: Build STL files in print layout
              run: |
                  openscad -D 'print_layout=true' -o artifacts/case_main.stl case/case_main.scad
                  openscad -D 'print_layout=true' -o artifacts/case_lid.stl case/case_lid.scad

            - name: Install Bambu Studio
              env:
                  APPIMAGE_URL: https://github.com/bambulab/BambuStudio/releases/download/v02.08.02.61/BambuStudio_ubuntu24.04-v02.08.02.61-20260820225108.AppImage
                  APPIMAGE_SHA256: d501b103fac5424513ec0e8d6bc145fb30719de2c7d94d7320d723740c81a7fd
              run: |
                  cd "$RUNNER_TEMP"
                  curl -fsSL -o BambuStudio.AppImage "$APPIMAGE_URL"
                  echo "$APPIMAGE_SHA256  BambuStudio.AppImage" | sha256sum -c
                  chmod +x BambuStudio.AppImage
                  ./BambuStudio.AppImage --appimage-extract > /dev/null
                  echo "BAMBU_STUDIO=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"

            - name: Build crimpdeq-case.3mf
              run: python3 scripts/export-bambu-project.py --output artifacts/crimpdeq-case.3mf

            - name: Upload case release files
              uses: actions/upload-artifact@v6
              with:
                  name: release-case-files
                  path: |
                      artifacts/case_main.stl
                      artifacts/case_lid.stl
                      artifacts/crimpdeq-case.3mf
                  if-no-files-found: error
                  compression-level: 0

    publish:
        name: Upload files to GitHub release
        runs-on: ubuntu-latest
        needs:
            - case

        steps:
            - name: Download case release files
              uses: actions/download-artifact@v7
              with:
                  name: release-case-files
                  path: release-assets/case

            - name: Verify release assets exist
              run: |
                  test -f release-assets/case/case_main.stl
                  test -f release-assets/case/case_lid.stl
                  test -f release-assets/case/crimpdeq-case.3mf

            - name: Upload release assets
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref }}
                  file: release-assets/*/*
                  file_glob: true
                  overwrite: true
