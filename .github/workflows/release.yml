name: Release Crimpdeq 3D Case

on:
    release:
        types: [created]

permissions:
    contents: write

jobs:
    case:
        name: Build 3D case release files
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Prepare output folder
              run: mkdir -p artifacts

            - name: Install OpenSCAD
              run: |
                  sudo apt-get update
                  sudo apt-get install -y openscad xvfb

            - name: Validate enclosure geometry
              run: CHECK_JOBS=4 OPENSCAD_RENDER_FN=24 bash scripts/check-collisions.sh

            - name: Build case_main.stl
              run: >-
                  xvfb-run -a openscad -D 'print_layout=true'
                  -o artifacts/case_main.stl case/case_main.scad

            - name: Build case_lid.stl
              run: >-
                  xvfb-run -a openscad -D 'print_layout=true'
                  -o artifacts/case_lid.stl case/case_lid.scad

            - name: Upload case release files
              uses: actions/upload-artifact@v6
              with:
                  name: release-case-files
                  path: |
                      artifacts/case_main.stl
                      artifacts/case_lid.stl
                  if-no-files-found: error
                  compression-level: 0

    publish:
        name: Upload files to GitHub release
        runs-on: ubuntu-latest
        needs:
            - case

        steps:
            - name: Download case release files
              uses: actions/download-artifact@v6
              with:
                  name: release-case-files
                  path: release-assets/case

            - name: Verify release assets exist
              run: |
                  test -f release-assets/case/case_main.stl
                  test -f release-assets/case/case_lid.stl

            - name: Upload release assets
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref }}
                  file: release-assets/*/*
                  file_glob: true
                  overwrite: true
